name: Feature request
description: Suggest a focused improvement to Chromium Tab Equalizer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem first, then the proposed solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or simpler alternatives you already tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio processing
        - Popup UI
        - Presets / site profiles
        - Options / import-export
        - Browser compatibility
        - Testing / developer experience
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: I understand the project avoids telemetry, accounts, cloud services, and broad host permissions.
          required: true
        - label: I checked existing issues for similar requests.
          required: true
