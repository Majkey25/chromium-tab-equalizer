# Check twice weekly in UTC, with stable times per repository, ecosystem and directory.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "11 21 * * 1,4"
      timezone: Etc/UTC
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "12 3 * * 2,6"
      timezone: Etc/UTC
