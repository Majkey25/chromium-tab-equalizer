name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static checks
        run: npm run check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium for Testing
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Resolve Chromium executable
        id: browser
        shell: bash
        run: |
          BROWSER_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' -perm -111 | head -n 1)"
          test -n "$BROWSER_PATH"
          echo "path=$BROWSER_PATH" >> "$GITHUB_OUTPUT"
      - name: Real unpacked-extension browser test
        env:
          BROWSER_PATH: ${{ steps.browser.outputs.path }}
        run: npm run test:browser
      - name: Package
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish stable GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi

          gh release create "$TAG" \
            dist/chromium-tab-equalizer-*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Chromium Tab Equalizer $TAG" \
            --notes-file .github/release-notes.md
